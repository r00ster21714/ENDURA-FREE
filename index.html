<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080B0D">
<meta name="description" content="ENDURA — offline workout, nutrition and body tracking.">
<title>ENDURA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="app.css">
</head>
<body>

  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>

</svg>

<div class="app" id="app">
  <main id="view" class="view" aria-live="polite"></main>

  <div id="restbar" class="restbar" hidden>
    <div class="restbar__ring" aria-hidden="true">
      <svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="19"/><circle class="prog" cx="22" cy="22" r="19"/></svg>
      <span id="rest-time">0:00</span>
    </div>
    <div class="restbar__meta">
      <strong id="rest-label">Rest</strong>
      <span id="rest-next" class="muted">next set</span>
    </div>
    <div class="restbar__acts">
      <button class="btn btn--ghost btn--sm" data-rest="-15">−15</button>
      <button class="btn btn--ghost btn--sm" data-rest="+15">+15</button>
      <button class="btn btn--sm" data-rest="skip">Skip</button>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Primary">
    <a href="#/today" data-tab="today"><svg class="ic"><use href="#i-home"/></svg><span>Today</span></a>
    <a href="#/workout" data-tab="workout"><svg class="ic"><use href="#i-dumbbell"/></svg><span>Train</span></a>
    <a href="#/nutrition" data-tab="nutrition"><svg class="ic"><use href="#i-fork"/></svg><span>Food</span></a>
    <a href="#/body" data-tab="body"><svg class="ic"><use href="#i-chart"/></svg><span>Body</span></a>
    <a href="#/settings" data-tab="settings"><svg class="ic"><use href="#i-gear"/></svg><span>You</span></a>
  </nav>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>

<div class="toastwrap" id="toastwrap" aria-live="assertive"></div>

<input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
<input type="file" id="file-input" accept="application/json" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
